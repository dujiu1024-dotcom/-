<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社交平台需求雷达</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f6fa}body{margin:0}header{background:#172033;color:white;padding:22px 5vw}main{max-width:1180px;margin:24px auto;padding:0 18px}h1{font-size:22px;margin:0 0 6px}.muted{color:#758096;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}section{background:white;border:1px solid #e2e7ef;border-radius:12px;padding:18px;margin-bottom:16px}h2{font-size:16px;margin:0 0 14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select{padding:10px;border:1px solid #cbd3df;border-radius:7px;min-width:130px;flex:1}button{padding:10px 14px;border:0;border-radius:7px;background:#2459d3;color:white;cursor:pointer}button.secondary{background:#e8edf7;color:#24334f}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px;border-bottom:1px solid #edf0f5}pre{white-space:pre-wrap;background:#111827;color:#d6e2f5;padding:12px;border-radius:8px;max-height:260px;overflow:auto;font-size:12px}label{font-size:12px;color:#68758b;display:block;margin:8px 0 4px}.status{font-weight:600}.ok{color:#16834a}.warn{color:#b66a00}
</style></head><body><header><h1>社交平台需求雷达</h1><div class="muted" style="color:#c4cede">本地运行 · 独立账号会话 · 最近 72 小时评论 · 需求证据库</div></header><main>
<section><div class="row" style="justify-content:space-between"><h2>采集引擎</h2><div><span id="engineStatus" class="status">检查中…</span> <button id="install" class="secondary">安装 / 检查 MediaCrawler</button></div></div><p class="muted">首次运行需安装引擎及依赖。浏览器首次登录需本人扫码；每个平台的登录资料由上游按平台名独立保存。</p><div id="platforms"></div></section>
<div class="grid"><section><h2>创建采集任务</h2><label>平台</label><select id="platform"><option value="xhs">小红书</option><option value="douyin">抖音</option><option value="kuaishou">快手</option><option value="bilibili">哔哩哔哩</option><option value="weibo">微博</option><option value="tieba">贴吧</option><option value="zhihu">知乎</option></select>
<label>采集方式</label><select id="mode"><option value="search">关键词搜索</option><option value="detail">指定内容链接 / ID</option><option value="creator">博主主页</option></select><label id="targetLabel">关键词（多个用英文逗号分隔）</label><input id="target" placeholder="例如：AI工具,效率软件"><label>每次采集内容数（1-100）</label><input id="posts" type="number" value="20" min="1" max="100"><label>每条内容评论数（1-1000）</label><input id="comments" type="number" value="100" min="1" max="1000"><label><input id="replies" type="checkbox" checked style="min-width:auto;flex:none"> 同时采集二级回复</label><button id="start">启动可见浏览器采集</button><p id="taskMsg" class="muted">一次只运行一个任务；请保持浏览器窗口可见并完成平台要求的登录验证。</p></section>
<section><h2>账号会话</h2><div id="sessions" class="muted">加载中…</div><p class="muted">会话目录存在不等于登录有效。失效后重新启动对应平台任务并扫码即可。</p></section></div>
<section><div class="row" style="justify-content:space-between"><h2>任务记录</h2><button class="secondary" id="refresh">刷新</button></div><div id="jobs"></div><pre id="logs">选择任务查看运行日志。</pre></section>
<section><div class="row" style="justify-content:space-between"><h2>评论与需求</h2><button class="secondary" id="import">导入采集结果并刷新</button></div><div id="stats" class="muted">尚未加载</div><div class="row"><button class="secondary" id="comments">查看最近 72 小时评论</button><button class="secondary" id="demands">查看需求候选</button></div><pre id="results">结果将在这里显示。</pre></section></main>
<script>
const $=id=>document.getElementById(id);
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw Error(d.detail||r.statusText);return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){const data=await Promise.all([api('/api/v1/engine/status'),api('/api/v1/sessions'),api('/api/v1/crawler/jobs'),api('/api/v1/platforms')]);const e=data[0],ss=data[1],js=data[2].items,ps=data[3];$('engineStatus').textContent=e.installed?'已安装':'未安装';$('engineStatus').className='status '+(e.installed?'ok':'warn');$('platforms').innerHTML='<table><tr><th>平台</th><th>引擎状态</th><th>采集模式</th></tr>'+ps.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.status)+'</td><td>'+esc(p.mode)+'</td></tr>').join('')+'</table>';$('sessions').innerHTML='<table><tr><th>平台</th><th>独立会话目录</th><th>状态</th></tr>'+ss.map(s=>'<tr><td>'+esc(s.platform)+'</td><td>'+(s.profile_exists?'已创建':'未创建')+'</td><td>'+(s.login_state==='unknown'?'待平台确认':'待首次登录')+'</td></tr>').join('')+'</table>';$('jobs').innerHTML=js.length?'<table><tr><th>任务</th><th>平台</th><th>方式</th><th>状态</th><th>操作</th></tr>'+js.map(j=>'<tr><td>'+esc(j.id)+'</td><td>'+esc(j.platform)+'</td><td>'+esc(j.mode)+'</td><td>'+esc(j.status)+'</td><td><button class="secondary" onclick="showLog(\''+esc(j.id)+'\')">日志</button> '+(j.status==='running'?'<button onclick="stop(\''+esc(j.id)+'\')">停止</button>':'')+'</td></tr>').join('')+'</table>':'暂无任务'}
async function showLog(id){$('logs').textContent=(await api('/api/v1/crawler/jobs/'+id+'/log')).log}
async function stop(id){await api('/api/v1/crawler/jobs/'+id,{method:'DELETE'});await refresh()}
$('mode').onchange=()=>{$('targetLabel').textContent={search:'关键词（多个用英文逗号分隔）',detail:'内容链接或 ID（多个用英文逗号分隔）',creator:'博主主页链接或 ID（多个用英文逗号分隔）'}[$('mode').value]}
$('install').onclick=async()=>{$('install').disabled=true;try{await api('/api/v1/engine/install',{method:'POST'});await refresh()}catch(e){alert(e.message)}finally{$('install').disabled=false}}
$('start').onclick=async()=>{try{const mode=$('mode').value,p={platform:$('platform').value,mode,include_replies:$('replies').checked,max_posts:+$('posts').value,max_comments_per_post:+$('comments').value};p[{search:'keywords',detail:'target_ids',creator:'creator_ids'}[mode]]=$('target').value;const j=await api('/api/v1/crawler/jobs',{method:'POST',body:JSON.stringify(p)});$('taskMsg').textContent='任务已启动：'+j.id+'。首次登录请在弹出的浏览器中扫码。';await refresh()}catch(e){$('taskMsg').textContent=e.message}}
$('refresh').onclick=()=>refresh().catch(e=>alert(e.message));
$('import').onclick=async()=>{try{const d=await api('/api/v1/imports/exports',{method:'POST'});$('stats').textContent=JSON.stringify(d);await refresh()}catch(e){alert(e.message)}}
$('comments').onclick=async()=>{$('results').textContent=JSON.stringify(await api('/api/v1/comments?since_hours=72'),null,2)}
$('demands').onclick=async()=>{$('results').textContent=JSON.stringify(await api('/api/v1/demands?since_hours=72'),null,2)}
refresh().catch(e=>$('engineStatus').textContent=e.message);
</script></body></html>
